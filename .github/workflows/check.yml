name: Plugin checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.15'
      - name: Check installer preservation and bridge cancellation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Python syntax and source staging
        run: |
          python3 -m compileall -q scripts tests
          python3 scripts/stage-plugin.py

  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.7.0'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.96.0'
          components: clippy,rustfmt
      - name: Fetch and verify the pinned public source
        run: python3 scripts/prepare-upstream.py
      - name: Check native code, SDKs, conformance, and documentation
        run: python3 scripts/verify-upstream.py
      - name: Validate real operator exchanges
        run: |
          python3 -m pip install -r tests/contracts.requirements.txt
          python3 scripts/check-runtime.py \
            --binary target/native/debug/hyphae \
            --contract-dir .upstream/hyphae/contracts/json-schema \
            --output target/validation/runtime-lexical.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: candidate-local-checks
          path: |
            target/validation/upstream/
            target/validation/runtime-lexical.json
          retention-days: 14
